# Cut a GitHub Release for each v* tag and attach the npm pack tarball as a
# release asset. Consumers (the yellow-plugins bridge) pin that asset URL —
# GitHub Release assets on a public repo are unmetered. Do not use
# actions/upload-artifact here: those artifacts expire and count against
# Actions storage.
#
# The tag must be annotated (`git tag -a v0.1.0 -m v0.1.0`) and match
# goal-gen/package.json version (v0.1.0 ↔ 0.1.0). Gates re-run on the
# tagged commit before the asset is published so a bad tag cannot ship.
# Never invoke npm run runner or --executor claude-code.
name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow: jobs that only run gates stay read-only.
# The publish job elevates to contents: write to create the Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a tag-publish in flight — a cancelled upload can leave a
  # half-created Release with no tarball.
  cancel-in-progress: false

defaults:
  run:
    working-directory: goal-gen

jobs:
  engine:
    name: typecheck, test, eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.x
          cache: npm
          cache-dependency-path: goal-gen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval

  install-smoke:
    name: pack, install, spawn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.x
          cache: npm
          cache-dependency-path: goal-gen/package-lock.json
      - run: npm ci
      - run: bash scripts/install-smoke.sh

  publish:
    name: attach tarball to GitHub Release
    needs: [engine, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.x
      - name: Pack and publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          tag_type="$(git cat-file -t "$tag" 2>/dev/null || true)"
          if [ "$tag_type" != "tag" ]; then
            echo "tag ${tag} is not annotated (git cat-file -t → ${tag_type:-missing}); cut with: git tag -a ${tag} -m ${tag}" >&2
            exit 1
          fi
          pkg_ver="$(node -p "require('./package.json').version")"
          if [ "$ver" != "$pkg_ver" ]; then
            echo "tag ${tag} does not match package.json version ${pkg_ver}" >&2
            exit 1
          fi
          tarball="$(npm pack | tail -n 1)"
          test -f "$tarball"
          expected="goal-gen-${ver}.tgz"
          if [ "$tarball" != "$expected" ]; then
            echo "expected packed tarball ${expected}, got ${tarball}" >&2
            exit 1
          fi
          notes="goal-gen ${ver} engine tarball (ADR-0016). Install: npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${expected} — spawn goal-gen as a process; never import the TypeScript."
          gh release create "$tag" "$tarball" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "$notes" \
            --verify-tag
