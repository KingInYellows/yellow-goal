# Automated Claude Code review on pull requests that touch the engine (mirrors the workflow in
# KingInYellows/yellow-plugins).
#
# The review job is gated on the CLAUDE_CODE_OAUTH_TOKEN repository secret. When the secret is
# absent the review job is skipped and the workflow stays green, so this file is safe to merge
# before the secret exists and activates as soon as it is added (Settings -> Secrets -> Actions).
# Fork PRs never receive secrets, so they are skipped by the same gate.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'goal-gen/**'
      - '.github/workflows/**'

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: check review token
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      - id: probe
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set for this repository; skipping Claude Code review"
          fi

  claude-review:
    name: review
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
