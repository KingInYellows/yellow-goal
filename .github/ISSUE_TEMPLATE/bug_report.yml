name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, please use
        **Security → Report a vulnerability** instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release tag you are running.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, shell, and Claude Code version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant output. Remove any tokens or secrets first.
      render: shell
