name: Bug report
description: goal-gen does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: goal-gen version and OS
      placeholder: 0.4.0 on Ubuntu 24.04, Node 22
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what you saw. Remove tokens and private paths from any logs.
    validations:
      required: true
